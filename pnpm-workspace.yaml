packages:
  - 'packages/**'
  - '!**/dist/**'
  - '!**/.next/**'
  - '!packages/haneul/test/**'
  - '!packages/kiosk/test/**'
  - '!packages/codegen/tests/move/**'
  - '!packages/create-dapp/templates/*/move/**'
  - '!packages/haneul/scripts'
  - '!packages/haneul/transactions'
  - '!packages/haneul/cryptography'
  - '!packages/haneul/faucet'
  - '!packages/haneul/client'
  - '!packages/haneul/verify'
  - '!packages/haneul/multisig'
  - '!packages/haneul/utils'
  - '!packages/haneul/bcs'
  - '!packages/enoki/react'
  - '!packages/haneul/graphql'
  - '!packages/haneul/keypairs/ed25519'
  - '!packages/haneul/keypairs/secp256k1'
  - '!packages/haneul/keypairs/secp256r1'
  - '!packages/haneul/graphql/schemas/2024.1'
  - '!packages/haneul/graphql/schemas/2024.4'
  - '!packages/haneul/zklogin'
  - '!packages/haneul/keypairs/passkey'
  - '!packages/haneul/graphql/schema'
  - '!packages/zksend/experimental/unified-adapter'
  - '!packages/haneul/experimental'
  - '!packages/dapp-kit/packages/dapp-kit-core/web'
  - '!packages/haneul/grpc'
  - '!packages/haneul/jsonRpc'

# Explicit empty allowlist — no package is permitted to run install/build scripts.
# Review a dependency before approving it with `pnpm approve-builds`.
allowBuilds: {}
autoInstallPeers: true

# Prevent transitive dependencies from resolving untrusted git or tarball URLs.
blockExoticSubdeps: true

# Disable dependency install/build lifecycle scripts by default.
ignoreScripts: true
# Without this, peerDeps using `*` (wallet-sdk / wallet-standard for
# @haneullabs/haneul) auto-install the npm-published copy alongside the
# workspace one — two distinct `Transaction` types -> TS2322 in the
# dapp-kit / walrus build chain. With link-workspace-packages on, any
# range that the workspace version satisfies (including `*`) links to
# the workspace sibling instead of the registry copy.
linkWorkspacePackages: true
# Enforce that packages must be at least 2 days old before they're installed
# This reduces the risk of supply chain attacks from newly published packages
minimumReleaseAge: 2880
publicHoistPattern:
  - '*storybook*'

# Prompt before running scripts when node_modules is out of sync with the
# lockfile, to catch drift or tampering between `pnpm install` and `pnpm run`.
verifyDepsBeforeRun: 'prompt'
